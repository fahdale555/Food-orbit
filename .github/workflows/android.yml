name: Build FoodOrbit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract FoodOrbit
        run: unzip FoodOrbit_Flutter_Starter.zip

      - name: Prepare Android project
        working-directory: FoodOrbit
        run: flutter create --platforms=android .

      - name: Build APK
        working-directory: FoodOrbit
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: FoodOrbit-APK
          path: FoodOrbit/build/app/outputs/flutter-apk/app-release.apk
